    <div id="root"></div>
    <script>
      // Start the splash now, before the app's code arrives, so a slow connection shows Orbit loading
      // instead of an empty page. The desktop app reveals its window first, so main.tsx starts it there.
      (function () {
        if ('__TAURI_INTERNALS__' in window) return;
        var splash = document.getElementById('orbit-splash');
        if (!splash) return;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            splash.classList.add('is-playing');
            window.__orbitSplashStart = performance.now();
          });
        });
        // Still here after a few seconds: say so, in the user's language.
        setTimeout(function () {
          if (!document.getElementById('orbit-splash')) return;
          var lang = '';
          try { lang = localStorage.getItem('orbit-language') || ''; } catch (e) {}
          var nav = (navigator.language || '').toLowerCase();
          if (!lang) lang = /^zh-(hans|cn|sg|my)/.test(nav) ? 'zh-Hans' : /^zh/.test(nav) ? 'zh-Hant' : 'en';
          var note = document.createElement('div');
          note.className = 'orbit-splash-slow';
          note.textContent = lang === 'zh-Hant' ? '載入中…網絡較慢，請稍候' : lang === 'zh-Hans' ? '加载中…网络较慢，请稍候' : 'Loading… the connection is slow';
          splash.appendChild(note);
          splash.classList.add('is-slow');
        }, 4000);
      })();
    </script>
