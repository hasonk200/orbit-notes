<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Notes, to-dos and projects in one place." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orbit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Orbit</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><clipPath id='of'><rect x='0' y='16' width='32' height='16'/></clipPath><mask id='om' maskUnits='userSpaceOnUse' x='0' y='0' width='32' height='32'><rect width='32' height='32' fill='%23fff'/><ellipse cx='16' cy='16' rx='14' ry='5.2' fill='none' stroke='%23000' stroke-width='5' clip-path='url(%23of)'/></mask><linearGradient id='og' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23fff3c4'/><stop offset='.4' stop-color='%23f2c14e'/><stop offset='.75' stop-color='%23c8901c'/><stop offset='1' stop-color='%238a5a0b'/></linearGradient><radialGradient id='op' cx='.35' cy='.3' r='.8'><stop offset='0' stop-color='%23a79dff'/><stop offset='.6' stop-color='%236d5efc'/><stop offset='1' stop-color='%234a3bd6'/></radialGradient></defs><g transform='rotate(-22 16 16)'><ellipse cx='16' cy='16' rx='14' ry='5.2' fill='none' stroke='url(%23og)' stroke-width='2.8'/><circle cx='16' cy='16' r='8' fill='url(%23op)' mask='url(%23om)'/><g clip-path='url(%23of)'><ellipse cx='16' cy='16' rx='14' ry='5.2' fill='none' stroke='url(%23og)' stroke-width='2.8'/><ellipse cx='16' cy='16' rx='14' ry='5.2' fill='none' stroke='%23fffbe8' stroke-opacity='.9' stroke-width='.6' transform='translate(0 -.75)'/></g></g></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <!-- Inter loads without holding up the page: where Google Fonts is slow or blocked (e.g. mainland China),
         Orbit shows straight away in the system font instead of waiting on a blank screen. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script>
      try {
        var t = localStorage.getItem('orbit-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style id="orbit-splash-style">
      #orbit-splash {
        --sp-bg: #f7f6f3;
        --sp-text: #1f1e1c;
        --sp-glow: rgba(109, 94, 252, 0.28);
        --sp-ring-glow: rgba(242, 193, 78, 0.26);
        --sp-halo: rgba(109, 94, 252, 0.25);
        --sp-track: rgba(31, 30, 28, 0.08);
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--sp-bg);
        color: var(--sp-text);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        pointer-events: none;
        user-select: none;
        transition:
          opacity 420ms cubic-bezier(0.22, 1, 0.36, 1),
          transform 440ms cubic-bezier(0.22, 1, 0.36, 1),
          filter 420ms ease;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) #orbit-splash {
          --sp-bg: #161615;
          --sp-text: #ecebe8;
          --sp-glow: rgba(139, 127, 255, 0.36);
          --sp-ring-glow: rgba(242, 193, 78, 0.30);
          --sp-halo: rgba(139, 127, 255, 0.32);
          --sp-track: rgba(236, 235, 232, 0.12);
        }
      }
      :root[data-theme='dark'] #orbit-splash {
        --sp-bg: #161615;
        --sp-text: #ecebe8;
        --sp-glow: rgba(139, 127, 255, 0.36);
        --sp-ring-glow: rgba(242, 193, 78, 0.30);
        --sp-halo: rgba(139, 127, 255, 0.32);
        --sp-track: rgba(236, 235, 232, 0.12);
      }
      #orbit-splash.is-leaving {
        opacity: 0;
        transform: scale(1.07);
        filter: blur(5px);
      }
      .orbit-splash-stage {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .orbit-splash-glow,
      .orbit-splash-halo,
      .orbit-splash-planet,
      .orbit-splash-ring-back,
      .orbit-splash-sat,
      .orbit-splash-wordmark,
      .orbit-splash-bar {
        opacity: 0;
      }
      .orbit-splash-glow {
        position: absolute;
        inset: -18px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--sp-glow) 0%, var(--sp-ring-glow) 44%, transparent 72%);
      }
      .orbit-splash-halo {
        position: absolute;
        inset: 2px;
        border-radius: 50%;
        border: 1.5px dashed var(--sp-halo);
      }
      .orbit-splash-mark {
        position: relative;
        width: 96px;
        height: 96px;
        overflow: visible;
      }
      .orbit-splash-planet { transform-origin: 60px 60px; }
      .orbit-splash-ring-back { transform-origin: 60px 60px; }
      .orbit-splash-ring-front,
      .orbit-splash-ring-sheen {
        stroke-dasharray: 185;
        stroke-dashoffset: 185;
      }
      .orbit-splash-sat { transform-origin: 60px 60px; }
      .orbit-splash-wordmark {
        font-size: 21px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .orbit-splash-bar {
        width: 72px;
        height: 2.5px;
        border-radius: 999px;
        background: var(--sp-track);
        overflow: hidden;
      }
      .orbit-splash-bar-fill {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #6d5efc, #f2c14e);
        transform: scaleX(0);
        transform-origin: left center;
      }
      #orbit-splash.is-playing .orbit-splash-glow {
        animation: orbit-splash-glow 850ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #orbit-splash.is-playing .orbit-splash-halo {
        animation: orbit-splash-halo 950ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #orbit-splash.is-playing .orbit-splash-planet {
        animation: orbit-splash-planet 680ms cubic-bezier(0.34, 1.56, 0.64, 1) 40ms both;
      }
      #orbit-splash.is-playing .orbit-splash-ring-back {
        animation: orbit-splash-ring-pop 620ms cubic-bezier(0.22, 1, 0.36, 1) 120ms both;
      }
      #orbit-splash.is-playing .orbit-splash-ring-front {
        animation: orbit-splash-ring-draw 760ms cubic-bezier(0.22, 1, 0.36, 1) 160ms forwards;
      }
      #orbit-splash.is-playing .orbit-splash-ring-sheen {
        animation: orbit-splash-ring-draw 760ms cubic-bezier(0.22, 1, 0.36, 1) 190ms forwards;
      }
      #orbit-splash.is-playing .orbit-splash-sat {
        animation: orbit-splash-dot 1050ms cubic-bezier(0.22, 1, 0.36, 1) 140ms both;
      }
      #orbit-splash.is-playing .orbit-splash-wordmark {
        animation: orbit-splash-title 640ms cubic-bezier(0.22, 1, 0.36, 1) 240ms both;
      }
      #orbit-splash.is-playing .orbit-splash-bar {
        animation: orbit-splash-fade 300ms ease 260ms both;
      }
      #orbit-splash.is-playing .orbit-splash-bar-fill {
        animation: orbit-splash-bar 920ms cubic-bezier(0.22, 1, 0.36, 1) 260ms forwards;
      }
      /* Slow connection: the bar keeps moving and a short line explains the wait. */
      #orbit-splash.is-slow .orbit-splash-bar-fill {
        animation: orbit-splash-slow 1.4s ease-in-out infinite;
      }
      .orbit-splash-slow {
        font-size: 13px;
        color: var(--sp-text);
        opacity: 0.6;
        animation: orbit-splash-fade 300ms ease both;
      }
      @keyframes orbit-splash-slow {
        0% { transform: translateX(-40%) scaleX(0.4); }
        100% { transform: translateX(100%) scaleX(0.4); }
      }
      @media (prefers-reduced-motion: reduce) {
        #orbit-splash.is-slow .orbit-splash-bar-fill { animation: none; }
      }
      @keyframes orbit-splash-fade {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes orbit-splash-glow {
        from { opacity: 0; transform: scale(0.4); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes orbit-splash-halo {
        from { opacity: 0; transform: scale(0.62) rotate(-45deg); }
        to { opacity: 1; transform: scale(1.06) rotate(12deg); }
      }
      @keyframes orbit-splash-planet {
        from { opacity: 0; transform: scale(0.48); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes orbit-splash-ring-pop {
        from { opacity: 0; transform: scale(0.72); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes orbit-splash-ring-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes orbit-splash-dot {
        from { opacity: 0; transform: rotate(-125deg) scale(0.35); }
        35% { opacity: 1; }
        to { opacity: 1; transform: rotate(22deg) scale(1); }
      }
      @keyframes orbit-splash-title {
        from { opacity: 0; transform: translateY(12px); letter-spacing: 0.18em; }
        to { opacity: 1; transform: translateY(0); letter-spacing: -0.02em; }
      }
      @keyframes orbit-splash-bar {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #orbit-splash,
        #orbit-splash * {
          animation: none !important;
          transition-duration: 1ms !important;
        }
        .orbit-splash-glow,
        .orbit-splash-halo,
        .orbit-splash-planet,
        .orbit-splash-ring-back,
        .orbit-splash-sat,
        .orbit-splash-wordmark,
        .orbit-splash-bar {
          opacity: 1;
        }
        .orbit-splash-ring-front,
        .orbit-splash-ring-sheen {
          stroke-dashoffset: 0;
        }
        .orbit-splash-bar-fill {
          transform: scaleX(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="orbit-splash" aria-hidden="true">
      <div class="orbit-splash-stage">
        <div class="orbit-splash-glow"></div>
        <div class="orbit-splash-halo"></div>
        <svg class="orbit-splash-mark" viewBox="0 0 120 120" width="96" height="96" fill="none">
          <defs>
            <clipPath id="orbit-sp-front">
              <rect x="0" y="60" width="120" height="60" />
            </clipPath>
            <mask id="orbit-sp-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
              <rect width="120" height="120" fill="#fff" />
              <ellipse cx="60" cy="60" rx="50" ry="18.5" fill="none" stroke="#000" stroke-width="15" clip-path="url(#orbit-sp-front)" />
            </mask>
            <linearGradient id="orbit-sp-gold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff4c8" />
              <stop offset=".4" stop-color="#f2c14e" />
              <stop offset=".75" stop-color="#c8901c" />
              <stop offset="1" stop-color="#8a5a0b" />
            </linearGradient>
            <radialGradient id="orbit-sp-planet" cx=".34" cy=".28" r=".8">
              <stop offset="0" stop-color="#b4abff" />
              <stop offset=".55" stop-color="#6d5efc" />
              <stop offset="1" stop-color="#4334c9" />
            </radialGradient>
          </defs>
          <g transform="rotate(-22 60 60)">
            <ellipse class="orbit-splash-ring-back" cx="60" cy="60" rx="50" ry="18.5" stroke="url(#orbit-sp-gold)" stroke-width="9" />
            <circle class="orbit-splash-planet" cx="60" cy="60" r="28" fill="url(#orbit-sp-planet)" mask="url(#orbit-sp-mask)" />
            <g clip-path="url(#orbit-sp-front)">
              <ellipse class="orbit-splash-ring-front" cx="60" cy="60" rx="50" ry="18.5" stroke="url(#orbit-sp-gold)" stroke-width="9" stroke-linecap="round" />
              <ellipse class="orbit-splash-ring-sheen" cx="60" cy="60" rx="50" ry="18.5" stroke="#fffbe8" stroke-opacity=".85" stroke-width="2" transform="translate(0 -2.4)" />
            </g>
            <g class="orbit-splash-sat">
              <circle cx="109" cy="60" r="4.5" fill="#fff7d6" />
            </g>
          </g>
        </svg>
      </div>
      <div class="orbit-splash-wordmark">Orbit</div>
      <div class="orbit-splash-bar"><div class="orbit-splash-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script>
      // Start the splash now, before the app's code arrives, so a slow connection shows Orbit loading
      // instead of an empty page. The desktop app reveals its window first, so main.tsx starts it there.
      (function () {
        if ('__TAURI_INTERNALS__' in window) return;
        var splash = document.getElementById('orbit-splash');
        if (!splash) return;
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            splash.classList.add('is-playing');
            window.__orbitSplashStart = performance.now();
          });
        });
        // Still here after a few seconds: say so, in the user's language.
        setTimeout(function () {
          if (!document.getElementById('orbit-splash')) return;
          var lang = '';
          try { lang = localStorage.getItem('orbit-language') || ''; } catch (e) {}
          var nav = (navigator.language || '').toLowerCase();
          if (!lang) lang = /^zh-(hans|cn|sg|my)/.test(nav) ? 'zh-Hans' : /^zh/.test(nav) ? 'zh-Hant' : 'en';
          var note = document.createElement('div');
          note.className = 'orbit-splash-slow';
          note.textContent = lang === 'zh-Hant' ? '載入中…網絡較慢，請稍候' : lang === 'zh-Hans' ? '加载中…网络较慢，请稍候' : 'Loading… the connection is slow';
          splash.appendChild(note);
          splash.classList.add('is-slow');
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
