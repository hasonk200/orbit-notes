name: Build Desktop & Mobile Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/lib/native.ts'
      - '.github/workflows/build-apps.yml'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Installer (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers (.exe & .msi)
        env:
          ORBIT_BUILD_NUMBER: ${{ github.run_number }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ORBIT_AI_URL: ${{ vars.VITE_ORBIT_AI_URL || secrets.VITE_ORBIT_AI_URL || 'https://orbitapi-327513878859.northamerica-northeast2.run.app' }}
        run: npx tauri build --bundles nsis,msi

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-android:
    name: Android APK (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        env:
          ORBIT_BUILD_NUMBER: ${{ github.run_number }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_ORBIT_AI_URL: ${{ vars.VITE_ORBIT_AI_URL || secrets.VITE_ORBIT_AI_URL || 'https://orbitapi-327513878859.northamerica-northeast2.run.app' }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android debug APK
        run: |
          cd android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK artifact
        run: |
          mkdir -p dist-mobile
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-mobile/Orbit-android-debug.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-apk
          if-no-files-found: error
          path: dist-mobile/Orbit-android-debug.apk

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: orbit-windows-installer
          path: release-assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: orbit-android-apk
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
