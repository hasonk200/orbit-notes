name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck & build web app
        run: npm run build

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Typecheck & bundle functions
        run: |
          npm --prefix functions run check
          npm --prefix functions run build
